<!DOCTYPE html>
<html>
    <head>
        <title>One-Page Website</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <!-- NAVIGATION -->
        <nav>
    <a href="#home">HOME</a><br>
    <a href="#pictures">PICTURES</a><br>
    <a href="#contact">CONTACT</a><br>
    <a href="#video">VIDEO</a>
</nav>
                <!-- HOME SECTION -->
        <section id="home">
            <h1>Welcome to My One-Page Website</h1>
            <p>Welcome to my website! This page contains information, pictures, a contact form, and a video.</p>
        </section>
                <!-- PICTURES SECTION -->
   <section id="pictures">
    <h2>My Favorite Animals</h2>

    <img src="https://images.unsplash.com/photo-1552053831-71594a27632d" alt="Dog" width="300" height="200">
    <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131" alt="Cat" width="300" height="200">
        <section id="contact">
    <h2>Contact Us</h2>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <input type="submit" value="Submit">
    </form>
</section>
<!-- VIDEO SECTION -->
<section id="video">
    <h2>My Favorite Video</h2>

    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/rT_I_GV_oEM"
        title="Cute Puppies Compilation"
        allowfullscreen>
    </iframe>
</section>
<!-- FOOTER -->
<footer>
    <p>&copy; 2026 My One-Page Website. All rights reserved.</p>
</footer>
    </body>
</html>
